on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    # windows-latest 目前是 VS 2026 (MSVC 14.51)，编 LeviLamina 26.51.9 会报
    # "forward declaration of 'Command'"（incomplete type）——这是 LL 源码头文件在
    # 新 MSVC 下的问题，不是本插件的问题。windows-2025 仍然是 VS 2022 (MSVC 14.44)。
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1
        # with:
        #   xmake-version: branch@master

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      - run: |
          xmake repo -u

      - run: |
          xmake repo --add -g levimc-repo https://github.com/LiteLDev/xmake-repo.git
          xrepo install -y -j1 -p windows -a x64 -m release -f "target_type=server" "levilamina 26.51.9"
          xrepo install -y -j1 -p windows -a x64 -m release levibuildscript

      - run: |
          xmake f -a x64 -m release -p windows -v --target_type=server -y

      - run: |
          xmake -v -y -j1

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-server-windows-x64
          path: |
            bin/
